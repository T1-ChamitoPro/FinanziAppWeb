apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finanziapp-ingress
  namespace: finanziapp
  labels:
    app.kubernetes.io/name: finanziapp-ingress
    app.kubernetes.io/part-of: finanziapp
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Ruta para el Backend REST API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          # Ruta principal para el Frontend React
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
