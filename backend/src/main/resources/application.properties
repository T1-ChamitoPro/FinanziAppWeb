spring.application.name=FinanziAppBackend
server.port=${PORT:8080}

# 1. Configuración de conexión a PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finanziapp_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation=DEBUG

# 2. Creación y actualización automática de la BD
spring.jpa.hibernate.ddl-auto=update

# 3. Dialecto de PostgreSQL para Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. Ver en consola del backend las sentencias SQL que Hibernate ejecuta
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true